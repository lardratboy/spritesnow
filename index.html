<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spritesnow</title>
<script type="importmap">
{ "imports": {} }
</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="controls" aria-label="Recipe controls">
    <h1>spritesnow</h1>
  </aside>
  <main id="main">
    <div id="stage" aria-label="Sprite sheet"></div>
    <div id="toolbar">
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="zoom-out" title="Zoom out (−)">−</button>
      <button id="fit" title="Fit the sheet (F)">Fit</button>
      <button id="blocks" title="Show where tier blocks meet (G)" aria-pressed="false">Blocks</button>
    </div>
    <section id="timeline" aria-label="Timeline"></section>
    <div id="status" role="status"></div>
  </main>
  <aside id="side">
    <section id="inspector" aria-label="Selected sprite"></section>
    <section id="collection" aria-label="Collection"></section>
  </aside>
  <script type="module" src="src/main.js"></script>
</body>
</html>
